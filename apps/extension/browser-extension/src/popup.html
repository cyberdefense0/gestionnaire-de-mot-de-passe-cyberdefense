<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Coffre</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --surface2: #1f2937;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #7d8590;
      --brand:    #58a6ff;
      --green:    #3fb950;
      --amber:    #d29922;
      --red:      #f85149;
      --radius:   6px;
    }

    body {
      width: 340px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
    }
    header img  { width: 18px; height: 18px; }
    header h1   { font-size: 13px; font-weight: 600; flex: 1; letter-spacing: .01em; }
    #lock-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1;
    }
    #lock-btn:hover { color: var(--text); background: var(--surface2); }
    #status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
    }
    #status-dot.ok { background: var(--green); }

    /* ── Panels ── */
    .panel { display: none; flex-direction: column; }
    .panel.active { display: flex; }

    /* ── Unlock panel ── */
    #panel-unlock { padding: 16px 14px; gap: 10px; }
    #panel-unlock p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
    .field-group { display: flex; flex-direction: column; gap: 4px; }
    .field-group label { font-size: 11px; color: var(--muted); font-weight: 500; }
    .field-group input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
      width: 100%;
    }
    .field-group input:focus { border-color: var(--brand); }
    .btn-primary {
      background: var(--brand);
      color: #0d1117;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      padding: 8px;
      cursor: pointer;
      width: 100%;
    }
    .btn-primary:hover { opacity: .88; }
    .btn-primary:disabled { opacity: .45; cursor: default; }
    .error-msg {
      font-size: 11px;
      color: var(--red);
      min-height: 14px;
    }
    .recovery-link {
      font-size: 11px;
      color: var(--brand);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      text-align: left;
    }
    .recovery-link:hover { text-decoration: underline; }

    /* ── Vault list panel ── */
    #panel-list { min-height: 120px; max-height: 440px; }
    #search-wrap {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #search {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 10px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    #search::placeholder { color: var(--muted); }
    #search:focus { border-color: var(--brand); }

    #entries {
      flex: 1;
      overflow-y: auto;
    }
    .entry {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      cursor: default;
      border-bottom: 1px solid var(--border);
    }
    .entry:last-child { border-bottom: none; }
    .entry-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      color: var(--brand);
      text-transform: uppercase;
    }
    .entry-body { flex: 1; min-width: 0; }
    .entry-label {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .entry-user {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }
    .entry-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .icon-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 3px 5px;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1;
    }
    .icon-btn:hover { background: var(--surface2); color: var(--text); }

    .empty-msg {
      padding: 24px 14px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    footer button {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      font-size: 11px;
      padding: 5px 4px;
      cursor: pointer;
      transition: color .12s, border-color .12s;
      white-space: nowrap;
    }
    footer button:hover { color: var(--text); border-color: var(--brand); }

    /* ── Setup panel (aucun vault) ── */
    #panel-setup { padding: 20px 14px; gap: 10px; }
    #panel-setup h2 { font-size: 14px; font-weight: 600; }
    #panel-setup p { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .btn-outline {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 13px;
      padding: 8px;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }
    .btn-outline:hover { border-color: var(--brand); color: var(--brand); }

    /* ── Loading ── */
    #panel-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
  </style>
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="">
    <h1>Coffre</h1>
    <div id="status-dot" title="Coffre verrouillé"></div>
    <button id="lock-btn" title="Verrouiller" style="display:none">🔒</button>
  </header>

  <!-- Chargement initial -->
  <div id="panel-loading" class="panel active">
    <div class="spinner"></div>
  </div>

  <!-- Aucun vault trouvé -->
  <div id="panel-setup" class="panel">
    <h2>Bienvenue dans Coffre</h2>
    <p>Aucun coffre n'est chargé. Importez un fichier .vault existant ou créez-en un nouveau.</p>
    <button class="btn-primary" id="btn-import-file">📂 Importer un fichier .vault</button>
    <button class="btn-outline"  id="btn-open-vault-page">➕ Créer un nouveau coffre</button>
    <input type="file" id="file-input" accept=".vault,.json" style="display:none">
    <div class="error-msg" id="setup-error"></div>
  </div>

  <!-- Déverrouillage -->
  <div id="panel-unlock" class="panel">
    <p id="unlock-desc">Entrez votre master password pour accéder au coffre.</p>
    <div class="field-group">
      <label for="master-pw">Master password</label>
      <input type="password" id="master-pw" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="error-msg" id="unlock-error"></div>
    <button class="btn-primary" id="btn-unlock">Déverrouiller</button>
    <button class="recovery-link" id="btn-use-recovery">Utiliser le kit de récupération…</button>
  </div>

  <!-- Liste des entrées -->
  <div id="panel-list" class="panel">
    <div id="search-wrap">
      <input id="search" type="search" placeholder="Rechercher…" autocomplete="off" spellcheck="false">
    </div>
    <div id="entries"></div>
    <footer>
      <button id="btn-manage">⚙ Gérer le coffre</button>
      <button id="btn-add">＋ Ajouter</button>
      <button id="btn-save">💾 Exporter</button>
    </footer>
  </div>

  <script src="../lib/argon2-browser/dist/argon2.js"></script>
  <script src="popup.js" type="module"></script>
</body>
</html>
