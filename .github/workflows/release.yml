# Build Coffre pour Windows, macOS (Intel + Apple Silicon), Linux et Android
# sur de vrais runners natifs pour chaque OS.
#
# Déclenchement : manuel (workflow_dispatch) ou push sur la branche `release`.
# La release GitHub est créée en brouillon (releaseDraft: true) pour vérification.
name: "publish"

on:
  workflow_dispatch:
  push:
    branches:
      - beta

jobs:
  publish-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"        # Mac Apple Silicon (M1+)
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"        # Mac Intel
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"        # Linux x64 (.deb + .AppImage)
            args: ""
          - platform: "windows-latest"      # Windows x64 (.msi + .exe)
            args: ""

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: apps/desktop   # ← NOUVEAU : tout se passe dans le sous-dossier

    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libxdo-dev

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json   # ← préciser le chemin

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"   # ← chemin corrigé

      - name: install frontend dependencies
        run: npm install   # exécuté dans apps/desktop

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: coffre-v__VERSION__
          releaseName: "Coffre v__VERSION__"
          releaseBody: "Voir les fichiers ci-dessous pour télécharger et installer cette version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: apps/desktop   # ← racine du projet Tauri (contient src-tauri/), pas src-tauri lui-même

  publish-android:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/desktop   # ← tout se passe dans apps/desktop
    env:
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      HAS_ANDROID_KEY: ${{ secrets.ANDROID_KEY_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v7

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: install Rust stable + cibles Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: install Android NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 8512546
          packages: "ndk;27.0.12077973"

      - name: set NDK env vars
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: install frontend dependencies
        run: npm install

      - name: init Android project
        run: npm run tauri android init

      # ---- Signature Android ----
      - name: setup Android signing
        if: env.HAS_ANDROID_KEY == 'true'
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd src-tauri/gen/android
          echo "keyAlias=$ANDROID_KEY_ALIAS" > keystore.properties
          echo "password=$ANDROID_KEY_PASSWORD" >> keystore.properties
          base64 -d <<< "$ANDROID_KEY_BASE64" > "$RUNNER_TEMP/upload-keystore.jks"
          echo "storeFile=$RUNNER_TEMP/upload-keystore.jks" >> keystore.properties

      - name: patch build.gradle.kts pour activer la signature
        if: env.HAS_ANDROID_KEY == 'true'
        run: |
          python3 - <<'PYEOF'
          import re, sys
          path = "src-tauri/gen/android/app/build.gradle.kts"
          with open(path, "r") as f:
              content = f.read()

          if "signingConfigs" in content:
              print("signingConfigs déjà présent, rien à faire.")
              sys.exit(0)

          if "import java.io.FileInputStream" not in content:
              content = "import java.io.FileInputStream\n" + content
          if "import java.util.Properties" not in content:
              content = "import java.util.Properties\n" + content

          signing_block = '''
              signingConfigs {
                  create("release") {
                      val keystorePropertiesFile = rootProject.file("keystore.properties")
                      val keystoreProperties = Properties()
                      if (keystorePropertiesFile.exists()) {
                          keystoreProperties.load(FileInputStream(keystorePropertiesFile))
                      }
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["password"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["password"] as String
                  }
              }
          '''

          new_content, n = re.subn(r'(android\s*\{)', r'\1\n' + signing_block, content, count=1)
          if n == 0:
              print("::error::Bloc 'android {' introuvable")
              sys.exit(1)
          content = new_content

          content, n = re.subn(
              r'(getByName\("release"\)\s*\{)',
              r'\1\n            signingConfig = signingConfigs.getByName("release")',
              content, count=1
          )
          if n == 0:
              content, n = re.subn(
                  r'(\brelease\s*\{)',
                  r'\1\n            signingConfig = signingConfigs.getByName("release")',
                  content, count=1
              )
          if n == 0:
              print("::error::Bloc release introuvable")
              sys.exit(1)

          with open(path, "w") as f:
              f.write(content)
          print("build.gradle.kts patché avec succès.")
          PYEOF

      # ---- Build de l'APK (UNIQUEMENT l'APK, pas l'AAB) ----
      - name: build Android APK
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mobile: "android"
          args: "--apk"   # ← uniquement l'APK, plus d'AAB
          tagName: coffre-v__VERSION__
          releaseName: "Coffre v__VERSION__"
          releaseBody: "Voir les fichiers ci-dessous pour télécharger et installer cette version."
          releaseDraft: true
          prerelease: false
          projectPath: apps/desktop   # ← racine du projet Tauri (contient src-tauri/), pas src-tauri lui-même

      - name: lire la version de l'app
        id: version
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: localiser l'APK généré
        id: android_apk
        run: |
          set -euo pipefail
          APK_PATH=$(find src-tauri/gen/android -type f -name "app-universal-release.apk" | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Aucun APK trouvé — fichiers présents :"
            find src-tauri/gen/android -type f -name "*.apk"
            exit 1
          fi
          echo "apk=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: vérifier que l'APK est signé
        if: env.HAS_ANDROID_KEY == 'true'
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "${{ steps.android_apk.outputs.apk }}"
          else
            echo "::warning::apksigner introuvable, vérification via unzip."
            if ! unzip -l "${{ steps.android_apk.outputs.apk }}" | grep -qE '\.(RSA|DSA|EC)$'; then
              echo "::error::Aucune signature trouvée dans l'APK."
              exit 1
            fi
          fi

      - name: renommer l'APK pour la release
        id: android_rename
        run: |
          DEST_APK="Coffre_${{ steps.version.outputs.version }}.apk"
          cp "${{ steps.android_apk.outputs.apk }}" "$DEST_APK"
          echo "apk=$DEST_APK" >> "$GITHUB_OUTPUT"

      - name: attacher l'APK à la release GitHub
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: coffre-v${{ steps.version.outputs.version }}
          draft: true
          prerelease: false
          files: |
            ${{ steps.android_rename.outputs.apk }}

  # ────────────────────────────────────────────────────────────────────────────
  # Extension navigateur (Chrome / Edge / Chromium)
  #
  # Pas de transpilation nécessaire (JS natif MV3) — on se contente de :
  #   1. Synchroniser la version du manifest.json avec tauri.conf.json
  #      (source de vérité unique pour le numéro de version).
  #   2. Valider que le manifest.json est un JSON valide.
  #   3. Créer le ZIP prêt à charger dans chrome://extensions ou à soumettre
  #      au Chrome Web Store.
  #   4. L'attacher à la release GitHub (brouillon) avec les binaires desktop.
  #
  # On attend publish-desktop (matrix complète) pour être certain que la
  # release GitHub existe déjà avant d'y attacher le ZIP.
  # ────────────────────────────────────────────────────────────────────────────
  publish-extension:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    needs: [publish-desktop]

    steps:
      - uses: actions/checkout@v7

      - name: lire la version depuis tauri.conf.json (source de vérité)
        id: version
        working-directory: apps/desktop/src-tauri
        run: |
          VERSION=$(node -p "require('./tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version de la release : $VERSION"

      - name: synchroniser la version dans manifest.json
        working-directory: apps/extension/browser-extension
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const path = 'manifest.json';
            const m = JSON.parse(fs.readFileSync(path, 'utf8'));
            const prev = m.version;
            m.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(m, null, 2) + '\n');
            console.log(\`manifest.json : \${prev} → \${m.version}\`);
          "

      - name: valider le manifest.json
        working-directory: apps/extension/browser-extension
        run: |
          python3 - << 'EOF'
          import json, sys

          REQUIRED_KEYS   = ["manifest_version", "name", "version", "background",
                             "permissions", "action"]
          REQUIRED_PERMS  = {"activeTab", "storage", "alarms", "tabs"}
          REQUIRED_ICONS  = {"16", "48", "128"}

          with open("manifest.json") as f:
              m = json.load(f)

          errors = []

          if m.get("manifest_version") != 3:
              errors.append("manifest_version doit être 3")

          for k in REQUIRED_KEYS:
              if k not in m:
                  errors.append(f"Clé manquante : {k}")

          missing_perms = REQUIRED_PERMS - set(m.get("permissions", []))
          if missing_perms:
              errors.append(f"Permissions manquantes : {missing_perms}")

          icon_keys = set(m.get("icons", {}).keys())
          missing_icons = REQUIRED_ICONS - icon_keys
          if missing_icons:
              errors.append(f"Tailles d'icône manquantes : {missing_icons}")

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print("manifest.json valide ✓")
          EOF

      - name: vérifier que les icônes PNG sont bien présentes
        working-directory: apps/extension/browser-extension
        run: |
          for size in 16 48 128; do
            if [ ! -f "icons/icon${size}.png" ]; then
              echo "::error::icons/icon${size}.png manquant"
              exit 1
            fi
            echo "icons/icon${size}.png ✓"
          done

      - name: créer le ZIP de l'extension
        id: zip
        working-directory: apps/extension/browser-extension
        run: |
          ZIP_NAME="coffre-extension-v${{ steps.version.outputs.version }}.zip"
          zip -r "../../../$ZIP_NAME" . \
            --exclude "*.DS_Store" \
            --exclude "__MACOSX/*" \
            --exclude "*.map"
          echo "zip=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "ZIP créé : $ZIP_NAME ($(du -sh "../../../$ZIP_NAME" | cut -f1))"

      - name: attacher le ZIP à la release GitHub
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: coffre-v${{ steps.version.outputs.version }}
          draft: true
          prerelease: false
          files: ${{ steps.zip.outputs.zip }}
