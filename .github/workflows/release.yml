# Build Coffre pour Windows, macOS (Intel + Apple Silicon) et Linux en parallèle,
# sur de vrais runners natifs pour chaque OS (pas de cross-compilation depuis
# Linux : GitHub fournit un runner Windows et un runner macOS réels).
#
# Basé sur le workflow officiel Tauri v2 :
# https://v2.tauri.app/distribute/pipelines/github/
#
# Déclenchement : manuel (bouton "Run workflow" dans l'onglet Actions) ou en
# poussant sur la branche `release`. L'action crée automatiquement un tag et
# une release GitHub (en brouillon — voir `releaseDraft` ci-dessous) contenant
# les installeurs pour chaque plateforme.
name: "publish"

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Mac Apple Silicon (M1 et +)
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # Mac Intel
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # Linux x64 (.deb + .AppImage)
            args: ""
          - platform: "windows-latest" # Windows x64 (.msi + .exe NSIS)
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Ces cibles ne servent que sur macOS (build Intel + Apple Silicon
          # depuis les mêmes runners) ; inutile sur Windows/Linux.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: coffre-v__VERSION__
          releaseName: "Coffre v__VERSION__"
          releaseBody: "Voir les fichiers ci-dessous pour télécharger et installer cette version."
          # En brouillon : la release n'est pas publiée automatiquement, tu
          # peux vérifier les artefacts avant de la rendre publique.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # ---------------------------------------------------------------------
  # Android (.apk) — job séparé, comme recommandé par la doc officielle
  # Tauri pour les cibles mobiles (v2.tauri.app/distribute/pipelines/github).
  #
  # ⚠️ Ce job n'a JAMAIS pu être exécuté ni vérifié dans le sandbox qui a
  # écrit ce fichier (pas de SDK/NDK Android, pas d'accès réseau aux
  # serveurs Google — voir DEV_NOTES.md, section "Passe mobile Android").
  # Écrit en suivant scrupuleusement la documentation officielle
  # (v2.tauri.app/distribute/sign/android, action.yml de tauri-action), mais
  # PAS testé en conditions réelles — à valider via "Run workflow" manuel
  # avant de compter dessus. Le job desktop ci-dessus, par comparaison, a
  # bien tourné et été corrigé sur de vrais retours utilisateur.
  #
  # La version d'API NDK ci-dessous (ndk-version) peut devenir obsolète :
  # si l'étape "install Android NDK" échoue, lister les versions
  # disponibles avec `sdkmanager --list` dans les logs et ajuster.
  publish-android:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      # Version NDK "side by side" à installer via sdkmanager. Ajuster si
      # `sdkmanager --list` ne la propose plus (voir note ci-dessus).
      NDK_VERSION: "27.0.12077973"
    steps:
      - uses: actions/checkout@v7

      - name: install system dependencies (webkit — nécessaire même pour un build mobile, la CLI Tauri compile aussi les crates du workspace)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: install Rust stable + cibles Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install Android NDK
        run: |
          echo "y" | sdkmanager --install "ndk;${{ env.NDK_VERSION }}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: install frontend dependencies
        run: npm install

      - name: init Android project
        run: npm run tauri android init

      # Signature release (voir v2.tauri.app/distribute/sign/android) : le
      # fichier keystore.properties n'est jamais commité (répertoire
      # gen/android entier généré à la volée par l'étape précédente, donc
      # absent du repo — voir .gitignore), reconstruit ici depuis des
      # secrets GitHub à créer au préalable dans les paramètres du dépôt :
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, ANDROID_KEY_BASE64
      # (ce dernier = `base64 -w0 upload-keystore.jks`, voir la doc pour
      # générer le keystore lui-même avec `keytool`). Tant que ce secret
      # n'est pas défini, cette étape est sautée et l'APK produit est signé
      # en debug par la CLI — suffisant pour tester sur un appareil, pas
      # pour publier sur le Play Store.
      - name: setup Android signing
        if: env.ANDROID_KEY_BASE64 != ''
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          cd src-tauri/gen/android
          echo "keyAlias=$ANDROID_KEY_ALIAS" > keystore.properties
          echo "password=$ANDROID_KEY_PASSWORD" >> keystore.properties
          base64 -d <<< "$ANDROID_KEY_BASE64" > "$RUNNER_TEMP/upload-keystore.jks"
          echo "storeFile=$RUNNER_TEMP/upload-keystore.jks" >> keystore.properties

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mobile: "android"
          tagName: coffre-v__VERSION__
          releaseName: "Coffre v__VERSION__"
          releaseBody: "Voir les fichiers ci-dessous pour télécharger et installer cette version."
          releaseDraft: true
          prerelease: false
